<div class="comment">
    <div class="comment-header">
        <h4 class="comment-name">{{comment.name}}</h4>
        <div class="rating">
            @for(star of [].constructor(comment.note); track $index) {
                <i class="bi bi-star-fill" [attr.aria-label]="'Star ' + ($index + 1)"></i>
            }
        </div>
    </div>
    <p class="comment-text">{{comment.comment}}</p>
</div>
